    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            color: #fff;
        }

        body {
            background-color: #0F0F14;
        }

        .stub {
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .stub .container {
            display: flex;
            flex-direction: column;
            width: calc(100% - 32px);
            margin: auto;
            padding: 24px 0;
            min-height: 100vh;
        }

        .stub__background {
            z-index: -1;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%);
            height: 683px;
        }

        .stub__top {
            padding-bottom: 240px;
        }

        .stub__logo img {
            max-width: 170px;
            height: 44px;
            width: 100%;
        }

        .stub__title {
            font-family: "Unbounded", sans-serif;
            font-size: 21px;
            line-height: 26px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .stub__text {
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
        }

        .stub__support {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .stub__support--item {
            display: flex;
            border-radius: 16px;
            background: rgba(10, 10, 13, 0.10);
            backdrop-filter: blur(20px);
            border: 1px solid #00DCCD;
            padding: 16px;
            flex: 1 1 100%;
        }

        .item__icon img {
            width: 52px;
            height: 52px;
            margin-right: 12px;
        }

        .item__content--title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 700;
            line-height: 150%;
            color: #fff;
        }

        .item__content--text {
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
            color: rgba(255, 255, 255, 0.65);
        }

        .item__content--text a {
            color: #00DCCD;
            text-decoration: none;
            transition: color 0.3s;
        }

        .item__content--text a:hover,
        .item__content--text a:active,
        .item__content--text a:focus {
            color: #fff;
        }


        @media (min-width: 480px) {
            .stub .container {
                max-width: 538px;
            }

            .stub__title {
                font-size: 27px;
                line-height: 32px;
            }
        }

        @media (min-width: 768px) {
            .stub__logo img {
                max-width: 216px;
                height: 56px;
            }

            .stub .container {
                padding: 48px 24px;
                max-width: calc(538px + 48px);
            }

            .stub__title {
                margin-top: 40px;
                margin-bottom: 24px;
            }

            .stub__top {
                padding-bottom: 336px;
            }

            .stub__background {
                top: 168px;
            }
        }

        @media (min-width: 1280px) {
            .stub .container {
                padding: 64px 32px;
                max-width: calc(800px + 64px);
            }

            .stub__background {
                top: 64px;
            }

            .stub__top {
                padding-bottom: 341px;
            }

            .stub__support {
                flex-direction: row;
            }
        }

        @media (min-width: 1440px) {
            .stub__background {
                height: 820px;
            }
        }

        @media (min-width: 1680px) {
            .stub__top {
                padding-bottom: 481px;
            }
        }
